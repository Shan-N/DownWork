apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - k8s.shannn.xyz
      secretName: downwork-tls
  rules:
    - host: k8s.shannn.xyz
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: downwork
              port:
                number: 80