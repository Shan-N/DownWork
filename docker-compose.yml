version: '3.8'

services:
  app:
    image: shan117/downwork:latest
    restart: always
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/ssl:/var/lib/letsencrypt
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
